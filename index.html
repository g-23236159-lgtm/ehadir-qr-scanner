<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-HADIR QR Scanner — SMK APIN-APIN</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff;padding:18px}
.wrap{max-width:1050px;margin:auto}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:22px;margin:0 0 4px}
.card{background:#fff;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 6px 24px #00000012}
input,button{font:inherit}
input{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:10px}
button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer}
.blue{background:#2563eb;color:#fff}
.gray{background:#e5e7eb;color:#172033}
.green{background:#16a34a;color:#fff}
.red{background:#dc2626;color:#fff}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
#reader{width:100%;max-width:760px;margin:auto;background:#000;border-radius:14px;overflow:hidden;min-height:320px}
.status{padding:14px;border-radius:12px;background:#eff6ff;margin-top:12px}
.success{background:#ecfdf5}
.error{background:#fef2f2}
.warning{background:#fffbeb}
.small{font-size:13px;color:#64748b}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:700;font-size:12px}
.active{background:#dcfce7;color:#166534}
@media(max-width:650px){.brand h1{font-size:18px}#reader{min-height:280px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <div style="font-size:38px">📷</div>
      <div>
        <h1>E-HADIR SMK APIN-APIN</h1>
        <div>KENINGAU · QR Scanner Kehadiran Pelajar</div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <h2 style="margin-top:0">📷 Imbas QR Pelajar</h2>
    <label><b>Nama guru / pentadbir</b></label>
    <input id="teacher" placeholder="Masukkan nama guru / pentadbir">

    <div class="status success">
      <span class="badge active">🟢 KAMERA SENTIASA AKTIF</span>
      <div style="margin-top:7px">Selepas satu QR berjaya dibaca dan direkodkan, kamera <b>terus berjalan</b>. Tidak perlu tekan <b>Mula Scanner</b> semula.</div>
    </div>

    <div id="reader"></div>

    <div class="controls">
      <button class="gray" id="stopBtn" onclick="stopCamera()">⏹ Berhenti</button>
      <button class="blue" id="resumeBtn" onclick="startCamera()">▶ Sambung Kamera</button>
      <button class="gray" onclick="switchCamera()">🔄 Tukar Kamera</button>
    </div>

    <div id="status" class="status">⏳ Kamera sedang disediakan...</div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">📋 Rekod Terakhir</h3>
    <div id="last">Belum ada imbasan.</div>
  </div>
</main>

<script>
const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbyedgvkplh0U-T_MVk__vt_n3Sp000-avyK94fxgprH41G3V4o3VLs06tvPFMYD_3X9ig/exec';

let scanner = null;
let running = false;
let cameras = [];
let cameraIndex = 0;
let processing = false;
let lastPayload = '';
let lastScanAt = 0;

const $ = id => document.getElementById(id);

function setStatus(msg, type='') {
  const el = $('status');
  el.className = 'status ' + type;
  el.innerHTML = msg;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function jsonp(params) {
  return new Promise((resolve, reject) => {
    const cb = 'ehadir_cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('Pelayan E-HADIR tidak memberi respons.'));
    }, 15000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[cb];
      script.remove();
    }

    window[cb] = data => {
      cleanup();
      resolve(data);
    };

    const qs = new URLSearchParams({
      ...params,
      callback: cb
    });

    script.src = APPS_SCRIPT_URL + '?' + qs.toString();
    script.onerror = () => {
      cleanup();
      reject(new Error('Tidak dapat menghubungi database E-HADIR.'));
    };
    document.body.appendChild(script);
  });
}

async function recordQR(payload) {
  const teacher = $('teacher').value.trim() || 'Guru/Pentadbir';

  try {
    setStatus('⏳ QR dikesan. Menghantar rekod ke database...', 'warning');

    const r = await jsonp({
      api: 'scan',
      payload: payload,
      teacher: teacher
    });

    if (!r || r.ok === false) {
      const msg = r?.message || 'QR tidak sah atau gagal direkodkan.';
      setStatus('❌ ' + escapeHtml(msg), 'error');
      return;
    }

    const student = r.student || {};
    const name = student.name || r.name || payload;
    const id = student.id || r.studentId || '';

    $('last').innerHTML =
      '<b>✅ ' + escapeHtml(name) + '</b>' +
      (id ? '<br><small>ID: ' + escapeHtml(id) + '</small>' : '') +
      '<br><small>' + escapeHtml(r.time || '') + '</small>';

    setStatus(
      '✅ <b>' + escapeHtml(name) +
      '</b> berjaya direkodkan. Kamera terus aktif — arahkan QR seterusnya.',
      'success'
    );
  } catch (e) {
    setStatus('❌ ' + escapeHtml(e.message || String(e)), 'error');
  }
}

async function onScanSuccess(decodedText) {
  const payload = String(decodedText || '').trim();
  if (!payload || processing) return;

  // Elak satu QR yang sama dihantar berkali-kali dalam beberapa saat.
  const now = Date.now();
  if (payload === lastPayload && now - lastScanAt < 2500) return;

  lastPayload = payload;
  lastScanAt = now;
  processing = true;

  try {
    await recordQR(payload);
  } finally {
    // Kamera TIDAK dihentikan.
    // Selepas rekod selesai, terus bersedia untuk QR berikutnya.
    setTimeout(() => { processing = false; }, 700);
  }
}

function onScanError() {
  // Sengaja kosong. QR yang belum lengkap bukan error pengguna.
}

async function startCamera() {
  if (running) {
    setStatus('🟢 Kamera sudah aktif. Arahkan QR pelajar ke kotak scanner.', 'success');
    return;
  }

  try {
    setStatus('📷 Membuka kamera... Sila benarkan akses kamera jika diminta.');

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Browser tidak menyokong kamera. Gunakan Chrome terkini.');
    }

    let stream = null;
    try {
      stream = await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    } finally {
      if (stream) stream.getTracks().forEach(t => t.stop());
    }

    cameras = await Html5Qrcode.getCameras();
    if (!cameras.length) throw new Error('Tiada kamera dikesan.');

    // Utamakan kamera belakang.
    const back = cameras.findIndex(c =>
      /back|rear|environment|belakang/i.test(c.label || '')
    );
    if (back >= 0) cameraIndex = back;
    if (cameraIndex >= cameras.length) cameraIndex = 0;

    scanner = new Html5Qrcode('reader', false);

    const config = {
      fps: 12,
      qrbox: (w,h) => {
        const q = Math.max(180, Math.min(300, Math.floor(Math.min(w,h)*0.72)));
        return {width:q,height:q};
      },
      aspectRatio: 1.0,
      rememberLastUsedCamera: true,
      showTorchButtonIfSupported: true
    };

    await scanner.start(
      cameras[cameraIndex].id,
      config,
      onScanSuccess,
      onScanError
    );

    running = true;
    setStatus(
      '🟢 <b>Kamera aktif — halakan QR ke kotak scanner.</b><br>' +
      '<small>Kamera kekal aktif selepas setiap scan.</small>',
      'success'
    );

  } catch (e) {
    running = false;
    setStatus(
      '❌ Kamera tidak dapat dibuka.<br><small>' +
      escapeHtml(e.message || String(e)) +
      '</small>',
      'error'
    );
  }
}

async function stopCamera() {
  if (!scanner) {
    running = false;
    setStatus('⏹ Kamera dihentikan.');
    return;
  }
  try { await scanner.stop(); } catch(e) {}
  try { scanner.clear(); } catch(e) {}
  scanner = null;
  running = false;
  setStatus('⏹ Kamera dihentikan. Tekan "Sambung Kamera" untuk mengaktifkan semula.');
}

async function switchCamera() {
  if (!cameras.length) return startCamera();

  const wasRunning = running;
  if (wasRunning) await stopCamera();

  cameraIndex = (cameraIndex + 1) % cameras.length;
  setStatus('🔄 Menukar kamera...');
  await startCamera();
}

window.addEventListener('load', () => {
  // Terus hidupkan kamera apabila laman scanner dibuka.
  startCamera();
});
</script>
</body>
</html>
