<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-HADIR QR Scanner — SMK APIN-APIN</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:white;padding:18px}.wrap{max-width:1050px;margin:auto}
.brand{display:flex;align-items:center;gap:12px}.brand h1{margin:0 0 4px;font-size:22px}
.card{background:#fff;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 6px 24px #0001}
label{font-weight:700}input{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:10px;margin-top:6px}
button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font:inherit}.blue{background:#2563eb;color:white}.gray{background:#e5e7eb}.green{background:#16a34a;color:white}.red{background:#dc2626;color:white}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.status{padding:13px;border-radius:12px;margin-top:12px;background:#eff6ff}.success{background:#ecfdf5}.error{background:#fef2f2}.warn{background:#fffbeb}
#reader{width:100%;max-width:760px;margin:auto;background:#000;border-radius:14px;overflow:hidden;min-height:320px}
.small{font-size:13px;color:#64748b}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.on{background:#dcfce7;color:#166534}
pre{white-space:pre-wrap;word-break:break-all;background:#f8fafc;border-radius:10px;padding:10px;font-size:12px}
@media(max-width:650px){.brand h1{font-size:18px}#reader{min-height:280px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand"><div style="font-size:38px">📷</div><div><h1>E-HADIR SMK APIN-APIN</h1><div>KENINGAU · QR Scanner Kehadiran Pelajar</div></div></div></div></header>

<main class="wrap">
<div class="card">
<h2 style="margin-top:0">📷 Imbas QR Pelajar</h2>
<label>Nama guru / pentadbir</label>
<input id="teacher" placeholder="Masukkan nama guru / pentadbir">

<div class="status success">
<span class="pill on">🟢 KAMERA SENTIASA AKTIF</span>
<div style="margin-top:7px">Scan satu demi satu. Selepas berjaya direkodkan, kamera <b>tidak berhenti</b>.</div>
</div>

<div id="reader"></div>

<div class="controls">
<button class="gray" onclick="stopCamera()">⏹ Berhenti</button>
<button class="blue" onclick="startCamera()">▶ Sambung Kamera</button>
<button class="gray" onclick="switchCamera()">🔄 Tukar Kamera</button>
</div>

<div id="status" class="status">⏳ Menyediakan kamera...</div>
</div>

<div class="card">
<h3 style="margin-top:0">📋 Rekod Terakhir</h3>
<div id="last">Belum ada imbasan.</div>
<div id="decoded" class="small" style="margin-top:10px"></div>
</div>
</main>

<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyedgvkplh0U-T_MVk__vt_n3Sp000-avyK94fxgprH41G3V4o3VLs06tvPFMYD_3X9ig/exec';
let scanner=null,running=false,cameras=[],cameraIndex=0,processing=false,lastText='',lastTime=0;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function status(msg,type=''){
  $('status').className='status '+type;
  $('status').innerHTML=msg;
}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb='ehadir_'+Date.now()+'_'+Math.floor(Math.random()*99999);
    const script=document.createElement('script');
    let done=false;
    const finish=(fn,v)=>{
      if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();fn(v);
    };
    const timer=setTimeout(()=>finish(reject,new Error('Database tidak memberi respons.')),15000);
    window[cb]=data=>finish(resolve,data);
    const q=new URLSearchParams({...params,callback:cb});
    script.src=APPS_SCRIPT_URL+'?'+q.toString();
    script.onerror=()=>finish(reject,new Error('Tidak dapat menghubungi database E-HADIR.'));
    document.body.appendChild(script);
  });
}

async function sendScan(text){
  const teacher=$('teacher').value.trim()||'Guru/Pentadbir';

  // QR E-HADIR yang dijana sistem mempunyai format tepat:
  // EHADIR|ID_MURID|TOKEN
  const parts=String(text).trim().split('|');
  if(parts.length!==3 || parts[0]!=='EHADIR'){
    status('❌ <b>QR bukan QR E-HADIR.</b><br><small>Format QR tidak dikenali.</small>','error');
    return;
  }

  status('⏳ QR sah dibaca. Menghantar rekod...','warn');

  const r=await jsonp({
    api:'scan',
    payload:String(text).trim(),
    teacher:teacher
  });

  if(!r || !r.ok){
    status('⚠️ <b>'+esc(r?.message||'QR tidak dapat direkodkan.')+'</b><br><small>Kamera kekal aktif. Sila scan murid seterusnya.</small>','error');
    return;
  }

  const s=r.student||{};
  $('last').innerHTML='<b>✅ '+esc(s.name||'Murid')+'</b><br>ID: '+esc(s.id||'')+
    '<br><small>Status: HADIR · Masa: '+esc(r.time||'')+'</small>';

  status('🟢 <b>'+esc(s.name||'Murid')+' berjaya direkodkan.</b><br><small>Halakan QR murid berikutnya — kamera masih aktif.</small>','success');
}

async function onScanSuccess(decodedText){
  const text=String(decodedText||'').trim();
  if(!text||processing)return;

  const now=Date.now();
  if(text===lastText && now-lastTime<3000)return;
  lastText=text;lastTime=now;processing=true;

  $('decoded').innerHTML='Kandungan QR dikesan: <pre>'+esc(text)+'</pre>';

  try{
    await sendScan(text);
  }catch(e){
    status('❌ '+esc(e.message||String(e))+'<br><small>Kamera kekal aktif.</small>','error');
  }finally{
    // PENTING: scanner tidak dihentikan di sini.
    setTimeout(()=>processing=false,700);
  }
}

function onScanFailure(){}

async function startCamera(){
  if(running){
    status('🟢 <b>Kamera sudah aktif.</b> Halakan QR seterusnya ke kotak scanner.','success');
    return;
  }

  try{
    status('📷 Membuka kamera...');

    if(!navigator.mediaDevices?.getUserMedia)
      throw new Error('Browser tidak menyokong akses kamera. Gunakan Chrome.');

    let test=null;
    try{test=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}
    finally{if(test)test.getTracks().forEach(t=>t.stop());}

    cameras=await Html5Qrcode.getCameras();
    if(!cameras.length)throw new Error('Tiada kamera dikesan.');

    const back=cameras.findIndex(c=>/back|rear|environment|belakang/i.test(c.label||''));
    cameraIndex=back>=0?back:0;

    scanner=new Html5Qrcode('reader',false);

    const config={
      fps:15,
      qrbox:(w,h)=>{
        const q=Math.max(200,Math.min(330,Math.floor(Math.min(w,h)*0.76)));
        return {width:q,height:q};
      },
      aspectRatio:1,
      formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],
      rememberLastUsedCamera:true,
      showTorchButtonIfSupported:true
    };

    await scanner.start(cameras[cameraIndex].id,config,onScanSuccess,onScanFailure);
    running=true;

    status('🟢 <b>Kamera aktif — halakan QR pelajar.</b><br><small>Selepas scan berjaya, kamera kekal aktif.</small>','success');

  }catch(e){
    running=false;scanner=null;
    status('❌ <b>Kamera gagal dibuka.</b><br><small>'+esc(e.message||String(e))+'</small>','error');
  }
}

async function stopCamera(){
  if(scanner){
    try{await scanner.stop()}catch(e){}
    try{scanner.clear()}catch(e){}
  }
  scanner=null;running=false;
  status('⏹ Kamera dihentikan. Tekan Sambung Kamera untuk mengaktifkan semula.','warn');
}

async function switchCamera(){
  if(!cameras.length){await startCamera();return;}
  if(running)await stopCamera();
  cameraIndex=(cameraIndex+1)%cameras.length;
  await startCamera();
}

window.addEventListener('load',startCamera);
</script>
</body>
</html>
